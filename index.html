<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Card Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Search bar -->
  <div id="searchContainer">
    <h1>MTG Card Search</h1>
    <div class="search-box">
      <input type="text" id="cardName" placeholder="Enter card name" />
      <button id="searchBtn">Search</button>
    </div>
  </div>

  <!-- Search results -->
  <div id="cardResult" class="results-container"></div>

  <!-- Pagination controls -->
  <div id="paginationControls">
    <button id="prevBtn" disabled>Previous</button>
    <span id="pageIndicator">Page 1 of 1</span>
    <button id="nextBtn" disabled>Next</button>
    <input id="jumpPage" type="number" min="1" placeholder="Jump to" />
    <button id="jumpBtn">Go</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
